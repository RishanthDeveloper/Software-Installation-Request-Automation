<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Fulfillment</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">
    <nav class="bg-purple-600 p-4 text-white shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold">IT Support Portal</h1>
            <div class="space-x-4">
                <a href="/" class="hover:underline">Employee</a>
                <a href="/manager.html" class="hover:underline">Manager</a>
                <a href="/it.html" class="hover:underline font-bold underline">IT Support</a>
                <a href="/dashboard.html" class="hover:underline">Dashboard</a>
            </div>
        </div>
    </nav>

    <div class="container mx-auto p-6">
        <h2 class="text-2xl font-bold mb-4">IT Tasks & Approvals</h2>
        
        <h3 class="text-xl font-semibold mt-6 mb-2">Pending IT Approvals</h3>
        <div id="itApprovalList" class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8"></div>

        <h3 class="text-xl font-semibold mt-6 mb-2">In Progress (Fulfillment)</h3>
        <div id="itFulfillmentList" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
    </div>

    <script src="/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadRoleRequests('IT Approval', 'itApprovalList', 'IT');
            loadFulfillmentRequests();
        });

        async function loadFulfillmentRequests() {
            try {
                const res = await fetch('/api/requests');
                const data = await res.json();
                const filtered = data.filter(r => r.state === 'In Progress' || r.state === 'Installed');
                const container = document.getElementById('itFulfillmentList');
                container.innerHTML = '';
                
                if(filtered.length === 0) {
                    container.innerHTML = '<p class="text-gray-500">No active tasks.</p>';
                    return;
                }

                filtered.forEach(r => {
                    let buttons = '';
                    if (r.state === 'In Progress') {
                        buttons = `<button onclick="updateRequest('${r.id}', 'Install', 'IT')" class="bg-blue-500 text-white px-3 py-1 rounded hover:bg-blue-600 text-sm mr-2">Mark Installed</button>`;
                    } else if (r.state === 'Installed') {
                        buttons = `<button onclick="updateRequest('${r.id}', 'Close', 'IT')" class="bg-green-500 text-white px-3 py-1 rounded hover:bg-green-600 text-sm">Close Request</button>`;
                    }

                    container.innerHTML += `
                        <div class="bg-white p-4 rounded-lg shadow border border-gray-200">
                            <div class="flex justify-between items-start mb-2">
                                <h3 class="font-bold text-lg">${r.id}</h3>
                                <span class="bg-purple-100 text-purple-800 text-xs px-2 py-1 rounded">${r.state}</span>
                            </div>
                            <p class="text-sm"><strong>Employee:</strong> ${r.employee} (${r.department})</p>
                            <p class="text-sm"><strong>Software:</strong> ${r.software} (${r.version})</p>
                            <p class="text-sm"><strong>Required By:</strong> ${r.requiredBy}</p>
                            <div class="mt-4 border-t pt-3">
                                ${buttons}
                            </div>
                        </div>
                    `;
                });
            } catch (error) {
                console.error(error);
            }
        }
    </script>
</body>
</html>
